display_information:
  name: Glow
  description: Glow OS operations alerts and analyst for Marissa's business.
  background_color: "#0a0a0a"

features:
  bot_user:
    display_name: Glow
    always_online: true
  slash_commands:
    - command: /glow
      url: https://YOUR_DEPLOYMENT_URL/api/slack/commands
      description: Query Glow OS status, payments, pipeline, and ask the analyst
      usage_hint: "[subcommand] [args]"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - commands
      - app_mentions:read
      - im:history
      - im:read
      - im:write
      - users:read
      - users:read.email

settings:
  event_subscriptions:
    request_url: https://YOUR_DEPLOYMENT_URL/api/slack/events
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
    request_url: https://YOUR_DEPLOYMENT_URL/api/slack/interactivity
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
